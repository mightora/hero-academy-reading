name: Browser reading journey checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium for emulated devices
        run: npx playwright install --with-deps chromium
      - name: Exercise all bands on desktop, mobile and landscape layouts
        run: npx playwright test tests/journey.browser.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
